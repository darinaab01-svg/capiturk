name: Expo iPhone preview
on:
  push:
    paths: ['expo/**', '.github/workflows/expo.yml']
  pull_request:
    paths: ['expo/**', '.github/workflows/expo.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node tests/content.cjs
      - run: npx expo install --check
      - run: npx expo export --platform ios
