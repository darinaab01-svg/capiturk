name: Native iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build for physical iPhone without signing
        run: xcodebuild -project Capiturk.xcodeproj -scheme Capiturk -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Select an available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Run native tests
        run: xcodebuild -project Capiturk.xcodeproj -scheme Capiturk -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult test
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
